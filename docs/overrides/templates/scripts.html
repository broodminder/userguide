<script text="javascript">
    // gtag is started by consent.js after analytics opt-in

    function updateHomeScreens() {
        var mainContainer = document.querySelector(".md-container");
        var desktopScreen = document.querySelector("#desktopScreen");
        var mobileScreen = document.querySelector("#mobileScreen");
        if (!mainContainer || !desktopScreen || !mobileScreen) {
            return;
        }
        if (mainContainer.clientWidth < 960) {
            mobileScreen.style.cssText = "display: block";
            desktopScreen.style.cssText = "display: none";
        } else {
            mobileScreen.style.cssText = "display: none";
            desktopScreen.style.cssText = "display: block";
        }
    }

    function relocateElementBySelector(elementSelector, destSelector) {
        var sourceElement = document.querySelector(destSelector);
        var destinationElement = document.querySelector(elementSelector);
        if (!sourceElement || !destinationElement) {
            return;
        }
        var positionTop = sourceElement.offsetTop;
        var positionLeft = sourceElement.offsetLeft;
        var width = sourceElement.clientWidth;

        destinationElement.style.cssText = "position: absolute !important; top: " + positionTop + "px !important;";
        destinationElement.style.cssText += "left: " + positionLeft + "px !important; width: " + width + "px !important";

        updateHomeScreens();
    }

    // Legacy Material search relocate (only if #search-form still exists)
    if (document.querySelector("#search-form") && document.querySelector(".md-search")) {
        relocateElementBySelector(".md-search", "#search-form");
        window.addEventListener("resize", function () {
            relocateElementBySelector(".md-search", "#search-form");
        });
    } else {
        updateHomeScreens();
        window.addEventListener("resize", updateHomeScreens);
    }
</script>
