site_name: USER DOCUMENTATION
dev_addr: 127.0.0.1:3200

docs_dir: docs/
exclude_docs: overrides/

site_url: https://doc.mybroodminder.com
site_description : Broodminder User Guide

theme:
  name: material
  font: false
  custom_dir: docs/overrides
  icon:
    alternate: svg/language
  logo:
    assets/images/BRM.png
  features:
    - navigation.indexes
  palette:
    primary: custom

extra:
  # Widget ← export/source .env before mkdocs (DOC_ASSISTANT_API, ENABLE_DOC_ASSISTANT)
  doc_assistant_api: !ENV [DOC_ASSISTANT_API, ""]
  doc_assistant_enabled: !ENV [ENABLE_DOC_ASSISTANT, "1"]
  social:
    - icon: fontawesome/solid/file-pdf
      link: /assets/pdf/userguide.pdf
      name: Version PDF

extra_css:
  - assets/css/extra.css
  - assets/css/doc-chat.css

extra_javascript:
  - assets/javascripts/extra.js
  - assets/javascripts/doc-chat.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      clickable_checkbox: true
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

